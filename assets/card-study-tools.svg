<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Study tools: interactive revision sites I build for my courses. SQL graded in the browser, a Cisco IOS simulator with self-grading missions, a cabling lab, a 438-card networking quiz and a Java lab trainer. Offline, no account.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070F"/><stop offset="1" stop-color="#101A2E"/></linearGradient>
    <radialGradient id="haze" cx=".8" cy=".55" r=".5"><stop offset="0" stop-color="#3B2A55" stop-opacity=".45"/><stop offset="1" stop-color="#3B2A55" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .s { animation: tw 5s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: .9; } }
    .ln { opacity: 0; animation: ln 9s steps(1) infinite; }
    .ck { opacity: 0; animation: ck 9s ease-out infinite; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes ln { 0% { opacity: 0; } 4%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ck { 0% { opacity: 0; } 4%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ln, .ck { opacity: 1; } }
  </style>
  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#haze)"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="15.5" fill="none" stroke="#22304A"/>
  <g fill="#DCE6FF">
    <circle class="s" cx="986" cy="27" r="1"/><circle class="s" style="animation-delay:.4s" cx="1108" cy="79" r=".8"/><circle class="s" style="animation-delay:3.6s" cx="1150" cy="300" r=".8"/><circle class="s" style="animation-delay:1.2s" cx="700" cy="30" r=".6"/><circle class="s" style="animation-delay:2.2s" cx="1170" cy="160" r="1"/><circle class="s" style="animation-delay:4.1s" cx="690" cy="315" r=".7"/>
  </g>

  <text x="56" y="62" class="mono" font-size="12" letter-spacing="1.6" fill="#9AA6BF">04 — STUDY TOOLS · 5 SITES</text>
  <text x="56" y="112" class="serif" font-size="40" fill="#ECEFF7">Revision tools I build</text>
  <text class="sans" font-size="18" fill="#C9D2E6">
    <tspan x="56" y="152">Before each exam I turn the course into an interactive site:</tspan>
    <tspan x="56" y="178">SQL graded in the browser, a Cisco IOS simulator with</tspan>
    <tspan x="56" y="204">self-grading missions, a cabling lab, a 438-card quiz and a</tspan>
    <tspan x="56" y="230">Java trainer. Offline, no account.</tspan>
  </text>
  <text x="56" y="266" class="serif" font-style="italic" font-size="15" fill="#9AA6BF">Mes sites de révision : je transforme chaque cours en outil interactif.</text>
  <g class="mono" font-size="12.5" fill="#C9D2E6">
    <rect x="56" y="284" width="98" height="26" rx="13" fill="#0E172A" stroke="#2E3D5C"/><text x="105" y="301.5" text-anchor="middle">sql.js·WASM</text>
    <rect x="162" y="284" width="112" height="26" rx="13" fill="#0E172A" stroke="#2E3D5C"/><text x="218" y="301.5" text-anchor="middle">IOS simulator</text>
    <rect x="282" y="284" width="96" height="26" rx="13" fill="#0E172A" stroke="#2E3D5C"/><text x="330" y="301.5" text-anchor="middle">JavaScript</text>
    <rect x="386" y="284" width="68" height="26" rx="13" fill="#0E172A" stroke="#2E3D5C"/><text x="420" y="301.5" text-anchor="middle">Offline</text>
  </g>

  <!-- terminal -->
  <g transform="translate(700 52)">
    <rect width="440" height="236" rx="12" fill="#0B1222" stroke="#2E3D5C"/>
    <path d="M0 12a12 12 0 0 1 12-12h416a12 12 0 0 1 12 12v18H0z" fill="#111B30"/>
    <circle cx="18" cy="15" r="4.5" fill="#2E3D5C"/><circle cx="33" cy="15" r="4.5" fill="#2E3D5C"/><circle cx="48" cy="15" r="4.5" fill="#2E3D5C"/>
    <text x="66" y="19.5" class="mono" font-size="11" fill="#6B7894">ios-simulator · TP1</text>
    <g class="mono" font-size="13.5">
      <text x="18" y="58" fill="#6B7894">Switch&gt; <tspan fill="#ECEFF7">enable</tspan></text>
      <text class="ln" style="animation-delay:.6s" x="18" y="82" fill="#6B7894">Switch# <tspan fill="#ECEFF7">conf t</tspan></text>
      <text class="ln" style="animation-delay:1.4s" x="18" y="106" fill="#6B7894">Switch(config)# <tspan fill="#ECEFF7">hostname S1</tspan></text>
      <text class="ln" style="animation-delay:2.2s" x="18" y="130" fill="#6B7894">S1(config)# <tspan fill="#ECEFF7">no ip domain-lookup</tspan></text>
      <text class="ln" style="animation-delay:3.0s" x="18" y="154" fill="#6B7894">S1(config)# <tspan fill="#ECEFF7">enable secret class</tspan></text>
      <text class="ln" style="animation-delay:3.8s" x="18" y="178" fill="#6B7894">S1(config)# <tspan fill="#7FD6FF" class="cur">▍</tspan></text>
    </g>
    <g class="mono" font-size="12.5" fill="#FFD27A">
      <text class="ck" style="animation-delay:1.6s" x="300" y="106">✓ hostname</text>
      <text class="ck" style="animation-delay:2.4s" x="300" y="130">✓ DNS off</text>
      <text class="ck" style="animation-delay:3.2s" x="300" y="154">✓ secret</text>
    </g>
    <rect x="18" y="200" width="404" height="6" rx="3" fill="#16213A"/>
    <rect x="18" y="200" width="160" height="6" rx="3" fill="#E0563F"/>
    <text x="422" y="226" text-anchor="end" class="mono" font-size="11" fill="#6B7894">3 / 10 pts</text>
  </g>
</svg>
